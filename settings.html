<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GronnFalk Settings</title>

    <link rel="icon" type="image/png" href="favicon3.png">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222;
        }

        .settings-page {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 35px 25px 60px;
        }

        .logo-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 45px;
        }

        .logo {
            width: 210px;
            height: auto;
            display: block;
        }

        .settings-title {
            margin: 0 0 30px;
            text-align: center;
            font-size: 28px;
        }

        .settings-section {
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 20px;
            background: #ffffff;
        }

        .settings-section h2 {
            margin: 0 0 8px;
            font-size: 20px;
        }

        .settings-section p {
            margin: 0 0 18px;
            color: #666;
            line-height: 1.5;
            font-size: 14px;
        }

       /* Search Engines */

        .engine-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .engine-option {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #ffffff;
            color: #222;

            display: flex;
            align-items: center;
            justify-content: space-between;

            font-family: inherit;
            font-size: 15px;
            font-weight: bold;
        }

        .engine-option:hover {
            border-color: #8ee000;
        }

        /* Toggle */

        .toggle {
            position: relative;
            width: 46px;
            height: 25px;
            flex-shrink: 0;
        }

        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.2s;
        }

        .toggle-slider::before {
            content: "";

            position: absolute;

            width: 19px;
            height: 19px;

            left: 3px;
            top: 3px;

            background: #ffffff;
            border-radius: 50%;

            transition: 0.2s;
        }

        .toggle input:checked + .toggle-slider {
            background: #8ee000;
        }

        .toggle input:checked + .toggle-slider::before {
            transform: translateX(21px);
        }

        /* Back button */

        .back-button {
            display: inline-block;

            margin-top: 10px;

            padding: 11px 18px;

            border-radius: 8px;

            background: #8ee000;
            color: #111;

            text-decoration: none;

            font-size: 14px;
            font-weight: bold;
        }

        .back-button:hover {
            opacity: 0.9;
        }

        @media (max-width: 700px) {

            .settings-page {
                padding: 25px 15px 45px;
            }

            .logo {
                width: 175px;
            }

            .settings-title {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

<main class="settings-page">


    <div class="logo-container">

        <img
            src="gronnfalk1.png"
            alt="GronnFalk"
            class="logo"
        >

    </div>


    <h1 class="settings-title">
        Settings
    </h1>


    <!-- SEARCH ENGINES -->

    <section class="settings-section">

        <h2>
            Search Engines
        </h2>

        <p>
            Choose which search engines GronnFalk uses for search results.
        </p>


        <div class="engine-options">


            <div class="engine-option">

                <span>
                    SearXNG
                </span>

                <label class="toggle">

                    <input
                        type="checkbox"
                        class="engine-toggle"
                        data-engine="searxng"
                    >

                    <span class="toggle-slider"></span>

                </label>

            </div>


            <div class="engine-option">

                <span>
                    Google
                </span>

                <label class="toggle">

                    <input
                        type="checkbox"
                        class="engine-toggle"
                        data-engine="google"
                    >

                    <span class="toggle-slider"></span>

                </label>

            </div>


            <div class="engine-option">

                <span>
                    DuckDuckGo
                </span>

                <label class="toggle">

                    <input
                        type="checkbox"
                        class="engine-toggle"
                        data-engine="duckduckgo"
                    >

                    <span class="toggle-slider"></span>

                </label>

            </div>


            <div class="engine-option">

                <span>
                    Brave
                </span>

                <label class="toggle">

                    <input
                        type="checkbox"
                        class="engine-toggle"
                        data-engine="brave"
                    >

                    <span class="toggle-slider"></span>

                </label>

            </div>


            <div class="engine-option">

                <span>
                    4get
                </span>

                <label class="toggle">

                    <input
                        type="checkbox"
                        class="engine-toggle"
                        data-engine="4get"
                    >

                    <span class="toggle-slider"></span>

                </label>

            </div>


        </div>

    </section>


    <a
        href="index.html"
        class="back-button"
    >
        Back to GronnFalk
    </a>


</main>


<script>


    /* =========================
       LANGUAGE SETTINGS
       ========================= */

    const languageOptions =
        document.querySelectorAll(".language-option");


    function updateActiveLanguage() {

        const savedLanguage =
            localStorage.getItem("gronnfalk-language") || "en";


        languageOptions.forEach(function(option) {

            if (
                option.dataset.language ===
                savedLanguage
            ) {

                option.classList.add("active");

            } else {

                option.classList.remove("active");

            }

        });

    }


    languageOptions.forEach(function(option) {

        option.addEventListener("click", function() {

            const language =
                option.dataset.language;


            localStorage.setItem(
                "gronnfalk-language",
                language
            );


            updateActiveLanguage();

        });

    });


    /* =========================
       SEARCH ENGINE SETTINGS
       ========================= */

    const engineToggles =
        document.querySelectorAll(".engine-toggle");


    const defaultEngineSettings = {

        searxng: true,

        google: true,

        duckduckgo: true,

        brave: true,

        "4get": true

    };


    function getEngineSettings() {

        const saved =
            localStorage.getItem(
                "gronnfalk-search-engines"
            );


        if (!saved) {

            return {
                ...defaultEngineSettings
            };

        }


        try {

            const parsed =
                JSON.parse(saved);


            return {
                ...defaultEngineSettings,
                ...parsed
            };

        } catch (error) {

            return {
                ...defaultEngineSettings
            };

        }

    }


    function loadEngineSettings() {

        const engines =
            getEngineSettings();


        engineToggles.forEach(function(toggle) {

            const engine =
                toggle.dataset.engine;


            toggle.checked =
                engines[engine] === true;

        });

    }


    function saveEngineSettings() {

        const engines = {};


        engineToggles.forEach(function(toggle) {

            engines[
                toggle.dataset.engine
            ] = toggle.checked;

        });


        localStorage.setItem(

            "gronnfalk-search-engines",

            JSON.stringify(engines)

        );

    }


    engineToggles.forEach(function(toggle) {

        toggle.addEventListener(
            "change",
            saveEngineSettings
        );

    });


    /* =========================
       START SETTINGS
       ========================= */

    updateActiveLanguage();

    loadEngineSettings();

</script>


</body>

</html>
