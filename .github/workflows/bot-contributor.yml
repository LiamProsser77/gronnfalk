name: GronnFalk Bot Contributor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Make contribution
        run: |
          echo "GronnFalk GitHub Actions contribution" >> .github-actions-contribution

      - name: Commit contribution
        run: |
          git add .github-actions-contribution
          git commit -m "chore: GitHub Actions contribution"
          git push
