```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GronnFalk Search</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ffffff;
            color: #222;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px 30px;
            border-bottom: 1px solid #e5e5e5;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: #8ee000;
            text-decoration: none;
            white-space: nowrap;
        }

        .search-container {
            flex: 1;
            max-width: 750px;
        }

        .search-form {
            display: flex;
            width: 100%;
        }

        .search-input {
            flex: 1;
            padding: 13px 16px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-right: none;
            border-radius: 8px 0 0 8px;
            outline: none;
        }

        .search-input:focus {
            border-color: #8ee000;
        }

        .search-button {
            padding: 0 22px;
            border: none;
            background: #8ee000;
            color: #111;
            font-size: 16px;
            font-weight: bold;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
        }

        .search-button:hover {
            opacity: 0.9;
        }

        .tabs {
            max-width: 900px;
            margin: 0 auto;
            padding: 18px 25px 0;
        }

        .tabs a {
            display: inline-block;
            margin-right: 25px;
            padding-bottom: 10px;
            color: #555;
            text-decoration: none;
            font-size: 15px;
        }

        .tabs a.active {
            color: #111;
            border-bottom: 2px solid #8ee000;
            font-weight: bold;
        }

        .results {
            max-width: 900px;
            margin: 0 auto;
            padding: 25px;
        }

        .result {
            margin-bottom: 30px;
        }

        .result-url {
            color: #555;
            font-size: 14px;
            margin-bottom: 5px;
            word-break: break-all;
        }

        .result-title {
            font-size: 21px;
            margin: 0 0 7px;
        }

        .result-title a {
            color: #1769aa;
            text-decoration: none;
        }

        .result-title a:hover {
            text-decoration: underline;
        }

        .result-description {
            color: #555;
            line-height: 1.5;
            font-size: 15px;
        }

        .status {
            color: #666;
            padding: 20px 0;
        }

        .error {
            color: #b00020;
        }

        @media (max-width: 700px) {
            .topbar {
                flex-direction: column;
                align-items: stretch;
                padding: 15px;
            }

            .logo {
                text-align: center;
            }

            .search-container {
                max-width: none;
            }

            .results,
            .tabs {
                padding-left: 15px;
                padding-right: 15px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="index.html" class="logo">
            GRONNFALK
        </a>

        <div class="search-container">

            <form class="search-form" id="searchForm">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search GronnFalk"
                    autocomplete="off"
                >

                <button
                    type="submit"
                    class="search-button"
                >
                    Search
                </button>

            </form>

        </div>

    </header>


    <nav class="tabs">

        <a
            id="webTab"
            class="active"
            href="#"
        >
            Web
        </a>

        <a
            id="imagesTab"
            href="#"
        >
            Images
        </a>

        <a
            id="newsTab"
            href="#"
        >
            News
        </a>

    </nav>


    <main class="results" id="results">

        <div class="status">
            Searching GronnFalk...
        </div>

    </main>


    <script>

        const API_URL =
            "https://gronnfalk.dockhosting.dev/search";


        const searchInput =
            document.getElementById("searchInput");


        const searchForm =
            document.getElementById("searchForm");


        const resultsContainer =
            document.getElementById("results");


        function escapeHTML(text) {

            const div =
                document.createElement("div");

            div.textContent =
                text || "";

            return div.innerHTML;
        }


        function getQuery() {

            const params =
                new URLSearchParams(
                    window.location.search
                );

            return params.get("q") || "";

        }


        async function search(
            query,
            category = "general"
        ) {

            if (!query) {

                resultsContainer.innerHTML =
                    '<div class="status">Enter a search query.</div>';

                return;
            }


            searchInput.value =
                query;


            resultsContainer.innerHTML =
                '<div class="status">Searching...</div>';


            try {

                const url =
                    `${API_URL}?q=${encodeURIComponent(query)}&category=${encodeURIComponent(category)}`;


                const response =
                    await fetch(url);


                if (!response.ok) {

                    throw new Error(
                        `Search failed: ${response.status}`
                    );

                }


                const data =
                    await response.json();


                displayResults(
                    data.results || []
                );


            } catch (error) {

                console.error(error);


                resultsContainer.innerHTML = `
                    <div class="status error">
                        Unable to load search results.
                    </div>
                `;

            }

        }


        function displayResults(results) {

            if (!results.length) {

                resultsContainer.innerHTML =
                    '<div class="status">No results found.</div>';

                return;

            }


            resultsContainer.innerHTML = "";


            results.forEach(result => {

                const resultElement =
                    document.createElement("article");


                resultElement.className =
                    "result";


                const url =
                    result.url || "#";


                const title =
                    result.title || "Untitled";


                const description =
                    result.content || "";


                resultElement.innerHTML = `

                    <div class="result-url">
                        ${escapeHTML(url)}
                    </div>

                    <h2 class="result-title">

                        <a
                            href="${escapeHTML(url)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            ${escapeHTML(title)}
                        </a>

                    </h2>

                    <div class="result-description">
                        ${escapeHTML(description)}
                    </div>

                `;


                resultsContainer.appendChild(
                    resultElement
                );

            });

        }


        searchForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const query =
                    searchInput.value.trim();


                if (!query) {
                    return;
                }


                window.location.href =
                    `results.html?q=${encodeURIComponent(query)}`;

            }
        );


        document
            .getElementById("imagesTab")
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();


                    const query =
                        searchInput.value.trim();


                    if (query) {

                        window.location.href =
                            `images.html?q=${encodeURIComponent(query)}`;

                    }

                }
            );


        document
            .getElementById("newsTab")
            .addEventListener(
                "click",
                function(event) {

                    event.preventDefault();


                    const query =
                        searchInput.value.trim();


                    if (query) {

                        window.location.href =
                            `results.html?q=${encodeURIComponent(query)}&category=news`;

                    }

                }
            );


        const initialQuery =
            getQuery();


        const params =
            new URLSearchParams(
                window.location.search
            );


        const initialCategory =
            params.get("category") || "general";


        search(
            initialQuery,
            initialCategory
        );

    </script>

</body>
</html>
