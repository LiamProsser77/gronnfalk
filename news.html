<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>GronnFalk News</title>

<meta
    name="description"
    content="Search news with GronnFalk."
>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #ffffff;
        color: #222;
    }

    .topbar {
        display: flex;
        align-items: center;
        gap: 20px;
        padding: 18px 30px;
        border-bottom: 1px solid #e5e5e5;
    }

    .logo {
        font-size: 26px;
        font-weight: bold;
        color: #8ee000;
        text-decoration: none;
        white-space: nowrap;
    }

    .search-container {
        flex: 1;
        max-width: 750px;
    }

    .search-form {
        display: flex;
        width: 100%;
    }

    .search-input {
        flex: 1;
        padding: 13px 16px;
        font-size: 16px;
        border: 1px solid #ccc;
        border-right: none;
        border-radius: 8px 0 0 8px;
        outline: none;
    }

    .search-input:focus {
        border-color: #8ee000;
    }

    .search-button {
        padding: 0 22px;
        border: none;
        background: #8ee000;
        color: #111;
        font-size: 16px;
        font-weight: bold;
        border-radius: 0 8px 8px 0;
        cursor: pointer;
    }

    .search-button:hover {
        opacity: 0.9;
    }

    .tabs {
        max-width: 900px;
        margin: 0 auto;
        padding: 18px 25px 0;
    }

    .tabs a {
        display: inline-block;
        margin-right: 25px;
        padding-bottom: 10px;
        color: #555;
        text-decoration: none;
        font-size: 15px;
    }

    .tabs a.active {
        color: #111;
        border-bottom: 2px solid #8ee000;
        font-weight: bold;
    }

    .news {
        max-width: 900px;
        margin: 0 auto;
        padding: 25px;
    }

    .news-result {
        margin-bottom: 30px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e5e5e5;
    }

    .news-url {
        color: #666;
        font-size: 14px;
        margin-bottom: 6px;
        word-break: break-all;
    }

    .news-title {
        font-size: 21px;
        margin: 0 0 8px;
    }

    .news-title a {
        color: #1769aa;
        text-decoration: none;
    }

    .news-title a:hover {
        text-decoration: underline;
    }

    .news-description {
        color: #555;
        line-height: 1.5;
        font-size: 15px;
    }

    .status {
        color: #666;
        padding: 20px 0;
    }

    .error {
        color: #b00020;
    }

    @media (max-width: 700px) {
        .topbar {
            flex-direction: column;
            align-items: stretch;
            padding: 15px;
        }

        .logo {
            text-align: center;
        }

        .search-container {
            max-width: none;
        }

        .news,
        .tabs {
            padding-left: 15px;
            padding-right: 15px;
        }
    }
</style>


</head>

<body>

```
<header class="topbar">

    <a href="index.html" class="logo">
        GRONNFALK
    </a>

    <div class="search-container">

        <form class="search-form" id="searchForm">

            <input
                type="search"
                id="searchInput"
                class="search-input"
                placeholder="Search news"
                autocomplete="off"
            >

            <button
                type="submit"
                class="search-button"
            >
                Search
            </button>

        </form>

    </div>

</header>


<nav class="tabs">

    <a
        href="#"
        id="webTab"
    >
        Web
    </a>

    <a
        href="#"
        id="imagesTab"
    >
        Images
    </a>

    <a
        href="#"
        id="newsTab"
        class="active"
    >
        News
    </a>

</nav>


<main
    class="news"
    id="news"
>

    <div class="status">
        Searching news...
    </div>

</main>


<script>

    const API_URL =
        "https://gronnfalk.dockhosting.dev/search";

    const searchInput =
        document.getElementById("searchInput");

    const searchForm =
        document.getElementById("searchForm");

    const newsContainer =
        document.getElementById("news");


    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent =
            text || "";

        return div.innerHTML;
    }


    function getQuery() {

        const params =
            new URLSearchParams(
                window.location.search
            );

        return params.get("q") || "";
    }


    async function searchNews(query) {

        if (!query) {

            newsContainer.innerHTML =
                '<div class="status">Enter a search query.</div>';

            return;
        }

        searchInput.value =
            query;

        newsContainer.innerHTML =
            '<div class="status">Searching news...</div>';


        try {

            const url =
                API_URL +
                "?q=" +
                encodeURIComponent(query) +
                "&category=news";


            const response =
                await fetch(url);


            if (!response.ok) {

                throw new Error(
                    "Search failed: " +
                    response.status
                );

            }


            const data =
                await response.json();


            displayNews(
                data.results || []
            );


        } catch (error) {

            console.error(error);

            newsContainer.innerHTML =
                '<div class="status error">' +
                'Unable to load news results.' +
                '</div>';

        }

    }


    function displayNews(results) {

        if (!results.length) {

            newsContainer.innerHTML =
                '<div class="status">No news found.</div>';

            return;
        }


        newsContainer.innerHTML =
            "";


        results.forEach(result => {

            const resultElement =
                document.createElement("article");

            resultElement.className =
                "news-result";


            const url =
                result.url || "#";

            const title =
                result.title || "Untitled";

            const description =
                result.content || "";


            resultElement.innerHTML =
                '<div class="news-url">' +
                escapeHTML(url) +
                '</div>' +

                '<h2 class="news-title">' +

                    '<a href="' +
                    escapeHTML(url) +
                    '" target="_blank" rel="noopener noreferrer">' +

                        escapeHTML(title) +

                    '</a>' +

                '</h2>' +

                '<div class="news-description">' +
                escapeHTML(description) +
                '</div>';


            newsContainer.appendChild(
                resultElement
            );

        });

    }


    searchForm.addEventListener(
        "submit",
        function(event) {

            event.preventDefault();

            const query =
                searchInput.value.trim();

            if (!query) {
                return;
            }

            window.location.href =
                "news.html?q=" +
                encodeURIComponent(query);

        }
    );


    document
        .getElementById("webTab")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                const query =
                    searchInput.value.trim();

                if (query) {

                    window.location.href =
                        "results.html?q=" +
                        encodeURIComponent(query);

                }

            }
        );


    document
        .getElementById("imagesTab")
        .addEventListener(
            "click",
            function(event) {

                event.preventDefault();

                const query =
                    searchInput.value.trim();

                if (query) {

                    window.location.href =
                        "images.html?q=" +
                        encodeURIComponent(query);

                }

            }
        );


    const query =
        getQuery();

    searchNews(query);

</script>


</body>
</html>
