```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GronnFalk</title>
    <meta
        name="description"
        content="GronnFalk — an open-source, privacy-focused metasearch engine."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Decorative corner triangles -->
    <div class="corner corner-top-left"></div>
    <div class="corner corner-top-right"></div>
    <div class="corner corner-bottom-left"></div>
    <div class="corner corner-bottom-right"></div>

    <main class="search-page">

        <!-- GronnFalk logo -->
        <img
            src="gronnfalk1.png"
            alt="GronnFalk"
            class="logo"
        >

        <!-- Search -->
        <form class="search-form" id="searchForm">
            <div class="search-box">
                <input
                    type="search"
                    id="searchInput"
                    name="q"
                    placeholder="Search GronnFalk"
                    autocomplete="off"
                    aria-label="Search GronnFalk"
                >

                <button type="submit" aria-label="Search">
                    🔍
                </button>
            </div>
        </form>

    </main>

    <!-- GitHub footer -->
    <footer>
        <a
            href="https://github.com/LiamProsser77/gronnfalk"
            target="_blank"
            rel="noopener noreferrer"
        >
            <span>Free and open source on GitHub</span>
            <span class="github-icon">◉</span>
        </a>
    </footer>

    <script src="app.js"></script>

</body>
</html>
```
